<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f5f4a">
<title>{% block title %}Buyer Finder{% endblock %}</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1c1a;--muted:#6b6a63;--line:#e3e1da;--brand:#1f5f4a;--brand-ink:#fff;
--now:#1f7a4d;--nurture:#a86b00;--watch:#6b6a63;--stale:#a33;--chip:#efede6}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--muted:#a09f97;--line:#33322e;
--brand:#4fa383;--brand-ink:#0d1f18;--now:#5cc28d;--nurture:#e0a43a;--watch:#a09f97;--stale:#e07070;--chip:#2a2a27}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--brand)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
padding:10px 16px;display:flex;align-items:center;gap:12px}
header .logo{font-weight:700;text-decoration:none;color:var(--ink)}
header nav{margin-left:auto;display:flex;gap:14px;align-items:center}
header form{margin:0}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=password],input[type=url],input[type=number],textarea,select{width:100%;padding:10px 12px;
font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
textarea{min-height:76px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
button,.btn{display:inline-block;padding:10px 14px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);
color:var(--brand-ink);font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
.btn.ghost,button.ghost{background:transparent;color:var(--brand)}
button.link{background:none;border:0;color:var(--brand);padding:0;font-weight:500}
.flash{background:var(--chip);border-radius:8px;padding:10px 12px;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-size:22px}
.score{font-weight:700;font-size:20px;min-width:42px;text-align:center}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0}
.r-now{color:var(--now)}.r-nurture{color:var(--nurture)}.r-watch{color:var(--watch)}.r-stale{color:var(--stale)}
.lead{display:flex;gap:12px;text-decoration:none;color:inherit}
.proof{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--chip);padding:6px 8px;border-radius:6px;
overflow-wrap:anywhere}
dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
@media (max-width:560px){dl{grid-template-columns:1fr}dt{margin-top:6px}}
.filters{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:8px}
@media (max-width:560px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}.filters button{grid-column:1/-1}}
</style>
</head>
<body>
{% if session.user %}
<header>
  <a class="logo" href="{{ url_for('home') }}">Buyer Finder</a>
  <nav>
    <a href="{{ url_for('import_page') }}">Import</a>
    <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <button class="link">Log out</button></form>
  </nav>
</header>
{% endif %}
<main>
{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}
</main>
</body>
</html>

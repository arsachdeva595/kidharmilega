{% extends "base.html" %}{% block title %}Sign in · Buyer Finder{% endblock %}
{% block body %}
<div class="card" style="max-width:380px;margin:12vh auto 0">
  <h1>Buyer Finder</h1>
  {% if error %}<div class="flash">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="u">Username</label><input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" required>
    <label for="p">Password</label><input type="password" id="p" name="password" autocomplete="current-password" required>
    <p><button style="width:100%">Sign in</button></p>
  </form>
</div>
{% endblock %}
